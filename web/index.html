<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111e2b" />
    <meta
      name="description"
      content="TumorGen research workspace for paired 3D brain tumor segmentation and MRI review."
    />
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('tumorgen-redesign-theme') === 'dark' ? 'dark' : 'light';
      } catch {
        document.documentElement.dataset.theme = 'light';
      }
      document.querySelector('meta[name="theme-color"]').content =
        document.documentElement.dataset.theme === 'light' ? '#f3f6f9' : '#111e2b';
    </script>
    <title>TumorGen · Segmentation workspace</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
