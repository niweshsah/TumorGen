[project]
name = "tumorgen-visualization-dataset"
version = "1.0.0"
description = "Reproducible public MRI and prediction preparation for TumorGen"
requires-python = ">=3.11,<3.13"
dependencies = [
    "nibabel>=5.3,<6",
    "numpy>=2.1,<3",
    "scipy>=1.14,<2",
    "scikit-image>=0.25,<1",
    "trimesh>=4.6,<5",
    "fast-simplification>=0.1.10,<1",
]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.13,<1"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
